# RU build. Built output is assembled by build.sh:
#   en -> /, ru -> /ru/, kk -> /kk/
[project]
site_name = "4etam"
site_description = "DevOps и бэкенд-инженер: инфраструктура, Kubernetes, базы данных и ИИ-инструменты."
site_author = "Abylai Nurlanuly"
site_url = "https://4etam.com/ru/"
repo_url = "https://github.com/almaty-itrider/4etam.com"
repo_name = "4etam.com"
edit_uri = "edit/main/ru/docs/"
copyright = "Copyright &copy; 2026 Abylai Nurlanuly"

# The Zensical blog plugin is not supported yet: add each new post to the
# "Blog" list below (newest first) and to blog/index.md.
nav = [
  { "Главная" = "index.md" },
  { "Проекты" = "projects.md" },
  { "Блог" = [
    "blog/index.md",
    "blog/2026-11-hello-world.md",
  ]},
  { "Обо мне" = "about.md" },
]

[project.theme]
language = "ru"
favicon = "assets/favicon.png"
logo = "assets/favicon.png"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "search.highlight",
  "content.code.copy",
  "content.action.edit",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Тёмная тема"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Светлая тема"

[project.extra]
alternate = [
  { name = "English", link = "/", lang = "en" },
  { name = "Қазақша", link = "/kk/", lang = "kk" },
  { name = "Русский", link = "/ru/", lang = "ru" },
]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/almaty-itrider"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/abylay-kuvatov-443b57168/"

[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:me@4etam.com"
