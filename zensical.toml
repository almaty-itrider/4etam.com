[project]
site_name = "4etam"
site_description = "DevOps & backend engineer: infrastructure, Kubernetes, databases and AI tooling."
site_author = "Abylai Nurlanuly"
site_url = "https://4etam.com/"
repo_url = "https://github.com/almaty-itrider/4etam.com"
repo_name = "4etam.com"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Abylai Nurlanuly"

# The blog is a plain section for now: the Zensical blog plugin is not
# supported yet. Add each new post to the "Blog" list below (newest first).
nav = [
  { "Home" = "index.md" },
  { "Projects" = "projects.md" },
  { "Blog" = [
    "blog/index.md",
    "blog/2026-11-hello-world.md",
  ]},
  { "About" = "about.md" },
]

[project.theme]
language = "en"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "search.highlight",
  "content.code.copy",
  "content.action.edit",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/almaty-itrider"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/abylay-kuvatov-443b57168/"

[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:me@4etam.com"
